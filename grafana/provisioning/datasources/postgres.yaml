apiVersion: 1

datasources:
  - name: Conversation PostgreSQL
    uid: conversation-postgres
    type: postgres
    access: proxy
    url: db:5432
    user: $__env{POSTGRES_USER}
    secureJsonData:
      password: $__env{POSTGRES_PASSWORD}
    jsonData:
      database: $__env{POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1000
      timescaledb: false
      maxOpenConns: 20
      maxIdleConns: 5
      connMaxLifetime: 14400
    isDefault: true
    editable: false
