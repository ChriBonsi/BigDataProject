apiVersion: 1

providers:
  - name: Conversation analytics
    orgId: 1
    folder: Conversation Analytics
    folderUid: conversation-analytics
    type: file
    disableDeletion: true
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
