services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: user_admin
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: api_data_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432" 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_admin -d api_data_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  api_fetcher:
    build: .
    container_name: api_fetcher_app
    depends_on:
      db:
        condition: service_healthy 
    environment:
      DATABASE_URL: postgresql://user_admin:secret_password@db:5432/api_data_db
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.api-fetcher.schedule: "@every 30m"
      ofelia.job-exec.api-fetcher.command: "python fetch_and_update.py"
    restart: unless-stopped
  ofelia:
    image: mcuadros/ofelia:latest
    depends_on:
      - api_fetcher
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
  grafana:
    image: grafana/grafana-oss:10.4.2
    container_name: grafana_viz
    ports:
      - "3000:3000"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data: