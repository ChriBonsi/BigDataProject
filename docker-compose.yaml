
services:
  API_Fetcher:
    build: .
    environment:
      DATABASE_URL: postgresql://username:password@external-host.com:5432/dbname
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.api-fetcher.schedule: "@every 30m"
      ofelia.job-exec.api-fetcher.command: "python fetch_and_update.py"
    restart: unless-stopped

  ofelia:
    image: mcuadros/ofelia:latest
    depends_on:
      - python-runner
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped